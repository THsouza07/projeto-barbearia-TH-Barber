<!DOCTYPE html>

<body>

  <div class="lista-horarios-wrapper">

      <div class="horario">

      </div>

      <div class="horario">

      </div>

      <div class="horario">
        <strong>SEXTA-FEIRA:</strong>
        <span>08:00 às 20:00</span>
      </div>

      <div class="horario">
        <strong>SÁBADO:</strong>

      <div class="horario domingo">
        <strong>DOMINGO:</strong>

</body>
</html>
