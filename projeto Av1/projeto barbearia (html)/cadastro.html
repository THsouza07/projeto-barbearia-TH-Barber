<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="../img/logomarca THBarber.png">
  <link rel="stylesheet" href="../CSS/style.css">
  <title>THBarber - Cadastro</title>
</head>
<body class="cadastro-page">

  <div class="cadastro-card">

    <form action="index.html" method="GET">

      <label for="email" class="cadastro-label">E-mail:</label><br>
      <input type="email" id="email" name="email" class="cadastro-input" placeholder="Seu E-mail" required>
      <br><br>

      <label for="data-nascimento" class="cadastro-label">Data de Nascimento:</label><br>
      <input type="date" id="data-nascimento" name="data_nascimento" class="cadastro-input" required>
      <br><br>

      <label for="senha" class="cadastro-label">Senha:</label><br>
      <input type="password" id="senha" name="senha" class="cadastro-input" placeholder="Senha de 8 caracteres" minlength="8" required>
      <br><br>

      <label for="confirmar-senha" class="cadastro-label">Confirmar senha:</label><br>
      <input type="password" id="confirmar-senha" name="confirmar_senha" class="cadastro-input" placeholder="Senha de 8 caracteres" minlength="8" required>
      <br><br>

      <button type="submit" class="btn-cadastrar">Cadastrar</button>

    </form>

  </div>

</body>
</html>
